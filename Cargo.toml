[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
# Символы в релизе не нужны: бинарь едет на сервер, а профилировать его
# собирают с `[profile.release] debug` отдельно.
strip = "symbols"

# Шум и свет — горячий путь генерации: в debug они медленнее на порядок,
# а отлаживают их всё равно тестами, не пошагово.
[profile.dev.package.chunkwake-worldgen]
opt-level = 3

[profile.dev.package.chunkwake-world]
opt-level = 3
