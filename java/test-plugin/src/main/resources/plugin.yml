name: ChunkwakeTest
version: '1.0'
main: dev.chunkwake.testplugin.ChunkwakeTestPlugin
api-version: '26.3'
folia-supported: true
description: Test plugin for the chunkwake bridge
commands:
  hello:
    description: Says hello
    usage: /hello
  kit:
    description: Heals and gives bread
    usage: /kit
    permission: chunkwake.test.kit
  up:
    description: Teleports up onto a glass block
    usage: /up [height]
permissions:
  chunkwake.test.kit:
    description: Use /kit
    default: op
