[package]
name = "chunkwake-bots"
description = "Нагрузочный тест: N офлайн-ботов заходят и ходят по кругу"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "chunkwake-bots"
path = "src/main.rs"

[[bin]]
name = "chunkwake-watch"
path = "src/bin/watch.rs"

[[example]]
name = "bot_fill_probe"
path = "examples/fill_probe.rs"

[dependencies]
chunkwake-data = { path = "../data" }
chunkwake-net = { path = "../net" }
chunkwake-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["full"] }
uuid = "1"
serde_json = "1"
