[package]
name = "chunkwake-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chunkwake-protocol = { path = "../protocol" }
bytes = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
