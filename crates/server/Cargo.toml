[package]
name = "chunkwake-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chunkwake"
path = "src/main.rs"

[dependencies]
chunkwake-bridge = { path = "../bridge" }
chunkwake-data = { path = "../data" }
chunkwake-metrics = { path = "../metrics" }
chunkwake-net = { path = "../net" }
chunkwake-protocol = { path = "../protocol" }
chunkwake-world = { path = "../world" }
chunkwake-worldgen = { path = "../worldgen" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
dotenvy = "0.15"
ratatui = "0.30.2"
rand = "0.8"
sha2 = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
tracing-appender = "0.2"

[dev-dependencies]
chunkwake-net = { path = "../net", features = ["bench"] }
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "tick"
harness = false

[[bench]]
name = "plugin_state"
harness = false
