[package]
name = "chunkwake-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chunkwake"
path = "src/main.rs"

[dependencies]
chunkwake-data = { path = "../data" }
chunkwake-net = { path = "../net" }
chunkwake-protocol = { path = "../protocol" }
chunkwake-world = { path = "../world" }
crossterm = "0.29"
dotenvy = "0.15"
ratatui = "0.30.2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
