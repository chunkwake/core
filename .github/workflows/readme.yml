name: README
# Счётчики в README и превью должны совпадать с docs/feature-matrix.md.
# Локально то же самое делает .githooks/pre-commit.
on:
  push:
    branches: ["ver/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check README stats
        run: python3 scripts/readme_stats.py --check
