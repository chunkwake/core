name: CI
on:
  push:
    branches: ["ver/**"]
  pull_request:

env:
  # Версия, под которую собран сервер (`crates/server/src/lib.rs`).
  MC_VERSION: "26.3"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Java 25 нужна генератору данных: из jar собирается кэш `generated/26.3`.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `server.jar` кладётся в корень workspace: оттуда его берёт `build.rs`.
      # Кэш держит и сам jar, и собранное из него дерево данных, поэтому
      # повторный запуск не качает 60 МБ и не гоняет генератор заново.
      - name: Cache server.jar and generated data
        uses: actions/cache@v4
        with:
          path: |
            server.jar
            generated
            target/vanilla-cache
          key: vanilla-${{ env.MC_VERSION }}-${{ runner.os }}-${{ hashFiles('crates/datacache/**', 'crates/data/build.rs') }}

      - name: Download server.jar
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f server.jar ]; then
            echo "server.jar уже в кэше"
            exit 0
          fi
          manifest=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
          meta=$(curl -fsSL "$manifest" \
            | jq -r --arg v "$MC_VERSION" '.versions[] | select(.id == $v) | .url')
          if [ -z "$meta" ]; then
            echo "версии $MC_VERSION нет в манифесте Mojang" >&2
            exit 1
          fi
          read -r url sha1 < <(curl -fsSL "$meta" \
            | jq -r '.downloads.server | "\(.url) \(.sha1)"')
          curl -fsSL -o server.jar "$url"
          echo "$sha1  server.jar" | sha1sum -c -

      - name: Download server.jar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path server.jar) { Write-Host 'server.jar уже в кэше'; exit 0 }
          $manifest = Invoke-RestMethod 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
          $entry = $manifest.versions | Where-Object { $_.id -eq $env:MC_VERSION }
          if (-not $entry) { throw "версии $($env:MC_VERSION) нет в манифесте Mojang" }
          $meta = Invoke-RestMethod $entry.url
          $server = $meta.downloads.server
          Invoke-WebRequest $server.url -OutFile server.jar
          $actual = (Get-FileHash server.jar -Algorithm SHA1).Hash.ToLower()
          if ($actual -ne $server.sha1) {
            throw "SHA-1 не совпал: ждали $($server.sha1), получили $actual"
          }

      # Первый проход собирает кэш данных из jar (`build.rs`), второй — уже с
      # `CHUNKWAKE_DATA`, поэтому сверки с ванилью видят настоящее дерево.
      - name: Build test binaries
        run: cargo test --workspace --no-run
        env:
          CHUNKWAKE_JAR: ${{ github.workspace }}/server.jar

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CHUNKWAKE_JAR: ${{ github.workspace }}/server.jar

      - name: Test with vanilla data
        shell: bash
        env:
          CHUNKWAKE_JAR: ${{ github.workspace }}/server.jar
        run: |
          set -euo pipefail
          # `build.rs` ищет кэш в `generated/<версия>`, затем в `target/vanilla-cache`.
          for dir in generated/26.3 target/vanilla-cache/26.3; do
            # Маркер ставится последним: каталог без него — недоделанный кэш.
            if [ -f "$dir/reports/packets.json" ]; then
              export CHUNKWAKE_DATA="$(cd "$dir" && pwd)"
              echo "сверки с ванилью включены: $CHUNKWAKE_DATA"
              break
            fi
          done
          if [ -z "${CHUNKWAKE_DATA:-}" ]; then
            echo "кэш данных не собрался, тесты идут без сверок"
          fi
          cargo test --workspace
