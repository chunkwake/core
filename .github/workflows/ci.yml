name: CI
# Полный прогон: push в ветки версий. Pull request'ы проверяет pr.yml
# (fmt всегда, clippy и тесты на Linux — если менялся код), без релизной сборки.
on:
  push:
    branches: ["ver/**"]
  workflow_dispatch:

env:
  # Версия, под которую собран сервер (`crates/server/src/lib.rs`).
  MC_VERSION: "26.3"

# Пропуск частей сборки — тегом в сообщении коммита:
#
#   [skip tests]    не гонять fmt, clippy и тесты
#   [skip release]  не собирать релизные бинарники
#   [skip both]     ни то, ни другое
#
# `[skip ci]` — встроенный тег GitHub: он отменяет весь workflow целиком,
# и до этой проверки дело не доходит. Нужен, когда не надо ничего.
#
# Тег действует на весь запуск: если в PR несколько коммитов, достаточно
# поставить его в любом из них (ищется по сообщениям всех коммитов ветки).
#
# Зачем вообще: релиз собирается на двух ОС и тянет Gradle и 60 МБ jar —
# на правке в документации или в тестах это лишние десять минут.

jobs:
  # Считает флаги один раз, чтобы остальные job'ы только читали результат:
  # выражение `if` не умеет разбирать сообщение коммита само по себе.
  flags:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.flags.outputs.tests }}
      release: ${{ steps.flags.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Нужна вся история: на pull_request тег может стоять в любом
          # коммите ветки, а не только в последнем.
          fetch-depth: 0

      - id: flags
        shell: bash
        name: Read skip tags
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Все коммиты PR, а не только вершина: тег ставят там, где удобно.
            message=$(git log --format=%B "${{ github.event.pull_request.base.sha }}..HEAD")
          else
            message=$(git log -1 --format=%B)
          fi
          echo "$message" | head -n 30

          tests=true
          release=true
          if grep -qiE '\[skip[ -]tests?\]' <<< "$message"; then tests=false; fi
          if grep -qiE '\[skip[ -]release\]' <<< "$message"; then release=false; fi
          if grep -qiE '\[skip[ -]both\]' <<< "$message"; then
            tests=false
            release=false
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "тесты: $tests, релиз: $release"

  rust:
    needs: flags
    if: needs.flags.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Java 25 нужна генератору данных: из jar собирается кэш `generated/26.3`.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `server.jar` кладётся в корень workspace: оттуда его берёт `build.rs`.
      # Кэш держит и сам jar, и собранное из него дерево данных, поэтому
      # повторный запуск не качает 60 МБ и не гоняет генератор заново.
      - name: Cache server.jar and generated data
        uses: actions/cache@v6
        with:
          path: |
            server.jar
            generated
            target/vanilla-cache
          key: vanilla-${{ env.MC_VERSION }}-${{ runner.os }}-${{ hashFiles('crates/datacache/**', 'crates/data/build.rs') }}

      # Публикуемая сборка должна быть полной, поэтому скачивание повторяемое:
      # скрипты ниже повторяют и запрос манифеста, и саму загрузку.
      # `bash` вызывается явно: бит исполнения в git может не доехать до раннера.
      - name: Download server.jar
        if: runner.os == 'Linux'
        run: bash ./.github/scripts/fetch-vanilla-jar.sh "$MC_VERSION"

      - name: Download server.jar
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/fetch-vanilla-jar.ps1 -Version $env:MC_VERSION

      # Первый проход собирает кэш данных из jar (`build.rs`), второй — уже с
      # `CHUNKWAKE_DATA`, поэтому сверки с ванилью видят настоящее дерево.
      # API плагинов сюда не встраивается: `cargo test` и clippy не должны
      # тащить 33 МБ jar'ов и требовать Gradle. Встраивает только job `release`.
      - name: Build test binaries
        run: cargo test --workspace --no-run
        env:
          CHUNKWAKE_JAR: ${{ github.workspace }}/server.jar
          CHUNKWAKE_API_BUNDLE: none

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CHUNKWAKE_JAR: ${{ github.workspace }}/server.jar
          CHUNKWAKE_API_BUNDLE: none

      - name: Test with vanilla data
        shell: bash
        env:
          CHUNKWAKE_JAR: ${{ github.workspace }}/server.jar
          CHUNKWAKE_API_BUNDLE: none
        run: |
          set -euo pipefail
          # `build.rs` ищет кэш в `generated/<версия>`, затем в `target/vanilla-cache`.
          for dir in generated/26.3 target/vanilla-cache/26.3; do
            # Маркер ставится последним: каталог без него — недоделанный кэш.
            if [ -f "$dir/reports/packets.json" ]; then
              export CHUNKWAKE_DATA="$(cd "$dir" && pwd)"
              echo "сверки с ванилью включены: $CHUNKWAKE_DATA"
              break
            fi
          done
          if [ -z "${CHUNKWAKE_DATA:-}" ]; then
            echo "кэш данных не собрался, тесты идут без сверок"
          fi
          cargo test --workspace

  # Параллельно с `rust`, а не после: правки в Java-части, README или скриптах
  # не должны ждать полного прогона тестов, чтобы выпустить бинарники. Связь
  # через `needs` осталась только с `flags` — она нужна ради тегов.
  release:
    needs: flags
    if: needs.flags.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux собирается под musl, а не под glibc: glibc-бинарник с
          # ubuntu-latest требует glibc 2.39 и падает на Debian 12 с
          # «GLIBC_2.xx not found». musl линкуется статически и работает везде.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-линкер и заголовки для статической сборки; `cc` соберёт под них
      # и C-часть mimalloc. Готовый кросс-тулчейн берём из GitHub Releases
      # (`rust-cross-toolchain`), а не через `apt-get`: зеркала Ubuntu
      # (archive/azure/security) периодически не резолвятся на раннере, и
      # релиз Linux падал ещё до сборки.
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      # Тот же ключ, что у job `rust`: кэш переиспользуется, jar не качается
      # повторно и дерево данных уже собрано.
      - name: Cache server.jar and generated data
        uses: actions/cache@v6
        with:
          path: |
            server.jar
            generated
            target/vanilla-cache
          key: vanilla-${{ env.MC_VERSION }}-${{ runner.os }}-${{ hashFiles('crates/datacache/**', 'crates/data/build.rs') }}

      # Публикуемая сборка должна быть полной, поэтому скачивание повторяемое:
      # скрипты ниже повторяют и запрос манифеста, и саму загрузку.
      # `bash` вызывается явно: бит исполнения в git может не доехать до раннера.
      - name: Download server.jar
        if: runner.os == 'Linux'
        run: bash ./.github/scripts/fetch-vanilla-jar.sh "$MC_VERSION"

      - name: Download server.jar
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/fetch-vanilla-jar.ps1 -Version $env:MC_VERSION

      # `CHUNKWAKE_BUNDLE` не задан, поэтому `build.rs` упаковывает дерево
      # данных в бинарь. Проверка ниже падает, если архив всё-таки пустой:
      # урезанный артефакт публиковать нельзя.
      - name: Resolve vanilla data
        shell: bash
        run: |
          set -euo pipefail
          echo "CHUNKWAKE_JAR=$GITHUB_WORKSPACE/server.jar" >> "$GITHUB_ENV"
          for dir in generated/26.3 target/vanilla-cache/26.3; do
            if [ -f "$dir/reports/packets.json" ]; then
              echo "CHUNKWAKE_DATA=$(cd "$dir" && pwd)" >> "$GITHUB_ENV"
              echo "готовый кэш: $dir"
              break
            fi
          done

      # API плагинов собирается здесь же и встраивается в бинарь: релиз должен
      # быть одним файлом, а не «exe плюс каталог api рядом». Gradle тянет
      # paper-api из сети, поэтому кэш Gradle переиспользуется между запусками.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('java/**/*.gradle.kts', 'java/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build plugin API
        shell: bash
        run: |
          set -euo pipefail
          # Бит исполнения в git может не доехать до раннера — зовём bash явно.
          bash java/gradlew -p java dist
          test -f java/dist/chunkwake-api.jar

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p chunkwake-server

      - name: Assert embedded data
        shell: bash
        run: |
          set -euo pipefail
          exe=target/${{ matrix.target }}/release/chunkwake
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          # Пустой `server.properties` — валиден: `Properties::parse` берёт
          # дефолты и накладывает на них файл. Порт сдвинут, чтобы не ловить
          # занятый 25565 на раннере.
          mkdir -p probe
          printf 'server-ip=127.0.0.1\nserver-port=25599\n' > probe/server.properties
          # Без встроенных данных `doctor` ругается на `vanilla-jar` и падает.
          "$exe" doctor --dir probe | tee doctor.txt
          if ! grep -q "embedded" doctor.txt; then
            echo "в бинаре нет ванильных данных — релиз неполный" >&2
            exit 1
          fi

      # Linux-релиз должен запускаться на чужой машине без наших библиотек.
      - name: Assert static linking
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          exe=target/${{ matrix.target }}/release/chunkwake
          # У musl-сборки не должно быть зависимости от glibc вообще.
          if readelf -d "$exe" 2>/dev/null | grep -q "libc.so.6"; then
            echo "бинарь всё ещё требует glibc" >&2
            exit 1
          fi
          # `file` показывает, статический ли бинарь: у musl без динамического
          # интерпретатора строка «statically linked».
          file "$exe"
          echo "проверка glibc пройдена"

      # Плагины требуют Java 25: без неё `doctor` обязан об этом сказать.
      - name: Assert java check
        shell: bash
        run: |
          set -euo pipefail
          exe=target/${{ matrix.target }}/release/chunkwake
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          mkdir -p java-probe/plugins
          cp java/dist/plugins/chunkwake-test-plugin.jar java-probe/plugins/
          # Путь заведомо неверный: doctor должен сказать про плагины и Java,
          # а не промолчать. CHUNKWAKE_JAVA сбрасываем, иначе он перекроет.
          printf 'server-ip=127.0.0.1\nserver-port=25597\njava-path=definitely-not-java\n' \
            > java-probe/server.properties
          unset CHUNKWAKE_JAVA
          if "$exe" doctor --dir java-probe > java.txt 2>&1; then
            echo "doctor не заметил отсутствующую Java при наличии плагинов" >&2
            cat java.txt
            exit 1
          fi
          if ! grep -qi "java" java.txt; then
            echo "сообщение doctor не упоминает Java" >&2
            cat java.txt
            exit 1
          fi
          echo "проверка Java работает"
          cat java.txt

      # Встроенный API проверяется запуском: рядом с бинарником нет `api/`,
      # и если он не развернулся из архива, плагин не включится. Проверять
      # наличие строки в бинаре бессмысленно — jar сжат.
      - name: Assert embedded plugin API
        shell: bash
        run: |
          set -euo pipefail
          exe=target/${{ matrix.target }}/release/chunkwake
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          mkdir -p apiprobe/plugins
          printf 'server-ip=127.0.0.1\nserver-port=25598\n' > apiprobe/server.properties
          # Плагин-пустышка: важно, что JVM поднялась и включила его из `api/`,
          # который развернулся из бинаря, а не лежал рядом.
          cp java/dist/plugins/chunkwake-test-plugin.jar apiprobe/plugins/ 2>/dev/null || true
          if [ ! -f java/dist/plugins/chunkwake-test-plugin.jar ]; then
            echo "нет собранного тестового плагина; проверяю только распаковку API"
          fi
          timeout 90 "$exe" run --dir apiprobe > api-run.txt 2>&1 || true
          if [ ! -f apiprobe/api/chunkwake-api.jar ]; then
            echo "API не развернулся из бинаря — релиз не самодостаточен" >&2
            cat api-run.txt
            exit 1
          fi
          n=$(ls apiprobe/api/libs/*.jar 2>/dev/null | wc -l)
          echo "развёрнуто библиотек: $n"
          if [ "$n" -lt 10 ]; then
            echo "в архиве API подозрительно мало библиотек" >&2
            exit 1
          fi
          # Лог обязан появиться файлом: служба без перенаправления иначе
          # теряет его целиком.
          if [ ! -f apiprobe/logs/latest.log ]; then
            echo "лог не пишется в файл" >&2
            exit 1
          fi

      # Бинарь, README и LICENSE: всё остальное (данные игры, API плагинов)
      # встроено. Плагины и мир создаются при первом запуске рядом.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="chunkwake-${MC_VERSION}-${{ matrix.artifact }}"
          mkdir -p "dist/$name"
          exe=target/${{ matrix.target }}/release/chunkwake
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          cp "$exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          # Размер виден в журнале: встроенный API добавляет ~34 МБ, и если
          # однажды он молча пропадёт, это заметят по цифре.
          ls -l "dist/$name"

      - uses: actions/upload-artifact@v7
        with:
          name: chunkwake-${{ env.MC_VERSION }}-${{ matrix.artifact }}
          path: dist/chunkwake-*
          if-no-files-found: error
